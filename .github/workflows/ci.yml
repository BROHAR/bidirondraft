# Lint + full Vitest suite on every PR and push to main, so Railway never
# deploys a commit the tests haven't seen. Actions are pinned to full commit
# SHAs (tags are mutable; SHAs aren't). The test suite runs entirely in
# jsdom/node — no Playwright browsers needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
